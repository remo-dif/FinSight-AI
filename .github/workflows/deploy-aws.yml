name: deploy-aws

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_sha:
        description: Commit SHA already published to GHCR
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      ECS_FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      ECS_BACKEND_TASK_FAMILY: ${{ vars.ECS_BACKEND_TASK_FAMILY }}
      ECS_FRONTEND_TASK_FAMILY: ${{ vars.ECS_FRONTEND_TASK_FAMILY }}
      ECS_BACKEND_CONTAINER: ${{ vars.ECS_BACKEND_CONTAINER }}
      ECS_FRONTEND_CONTAINER: ${{ vars.ECS_FRONTEND_CONTAINER }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      ORIGIN_HTTPS_URL: ${{ vars.ORIGIN_HTTPS_URL }}
      E2E_TLS_REQUIRED: ${{ vars.E2E_TLS_REQUIRED }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      RDS_DB_INSTANCE_ID: ${{ vars.RDS_DB_INSTANCE_ID }}
      S3_UPLOAD_BUCKET: ${{ vars.S3_UPLOAD_BUCKET }}
      IMAGE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.image_sha || github.event.workflow_run.head_sha }}
      BACKEND_IMAGE: ghcr.io/remo-dif/finsight-ai-backend
      FRONTEND_IMAGE: ghcr.io/remo-dif/finsight-ai-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}
      - name: Validate deployment configuration
        shell: bash
        run: |
          required=(
            AWS_ROLE_ARN AWS_REGION ECS_CLUSTER ECS_BACKEND_SERVICE ECS_FRONTEND_SERVICE
            ECS_BACKEND_TASK_FAMILY ECS_FRONTEND_TASK_FAMILY
            ECS_BACKEND_CONTAINER ECS_FRONTEND_CONTAINER IMAGE_SHA PUBLIC_APP_URL
            ORIGIN_HTTPS_URL CLOUDFRONT_DISTRIBUTION_ID RDS_DB_INSTANCE_ID S3_UPLOAD_BUCKET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub production variable: $name" >&2
              exit 1
            fi
          done
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify public HTTPS posture
        shell: bash
        run: |
          if [ "$E2E_TLS_REQUIRED" != "true" ]; then
            echo "Production deploys require end-to-end TLS (E2E_TLS_REQUIRED=true)." >&2
            exit 1
          fi
          for url in "$PUBLIC_APP_URL" "$ORIGIN_HTTPS_URL"; do
            case "$url" in
              https://*) ;;
              *) echo "Production endpoint must use HTTPS: $url" >&2; exit 1 ;;
            esac
            curl --fail --show-error --silent --retry 5 --retry-delay 5 "$url/readyz" > /dev/null
          done
      - name: Verify production AWS controls
        shell: bash
        run: |
          distribution=$(aws cloudfront get-distribution \
            --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --query Distribution.DistributionConfig \
            --output json)
          if [ -z "$(jq -r '.WebACLId // empty' <<< "$distribution")" ]; then
            echo "CloudFront distribution must have an AWS WAF web ACL." >&2
            exit 1
          fi
          if ! jq -e 'all(.Origins.Items[]; (has("CustomOriginConfig") | not) or .CustomOriginConfig.OriginProtocolPolicy == "https-only")' \
            <<< "$distribution" > /dev/null; then
            echo "Every CloudFront custom origin must use HTTPS only." >&2
            exit 1
          fi

          database=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_DB_INSTANCE_ID" \
            --query 'DBInstances[0]' \
            --output json)
          if ! jq -e '.MultiAZ == true and .StorageEncrypted == true and .PubliclyAccessible == false' \
            <<< "$database" > /dev/null; then
            echo "RDS must be Multi-AZ, encrypted, and private." >&2
            exit 1
          fi

          public_access=$(aws s3api get-public-access-block \
            --bucket "$S3_UPLOAD_BUCKET" \
            --query PublicAccessBlockConfiguration \
            --output json)
          if ! jq -e 'all(.[]; . == true)' <<< "$public_access" > /dev/null; then
            echo "The uploads bucket must block all forms of public access." >&2
            exit 1
          fi
          aws s3api get-bucket-encryption --bucket "$S3_UPLOAD_BUCKET" > /dev/null
      - name: Deploy immutable images to ECS
        shell: bash
        run: |
          register_task_definition() {
            local family="$1"
            local container="$2"
            local image="$3"
            local current="${family}-current.json"
            local rendered="${family}-rendered.json"

            aws ecs describe-task-definition \
              --task-definition "$family" \
              --query taskDefinition \
              --output json > "$current"

            if ! jq -e '(.cpu | tonumber) > 0 and (.memory | tonumber) > 0' \
              "$current" > /dev/null; then
              echo "Fargate task family $family must declare task-level CPU and memory." >&2
              exit 1
            fi

            jq --arg container "$container" --arg image "$image" '
              if any(.containerDefinitions[]; .name == $container) then
                (.containerDefinitions[] | select(.name == $container) | .image) = $image
                | del(
                    .taskDefinitionArn,
                    .revision,
                    .status,
                    .requiresAttributes,
                    .compatibilities,
                    .registeredAt,
                    .registeredBy
                  )
              else
                error("Container not found in task definition: " + $container)
              end
            ' "$current" > "$rendered"

            local task_definition
            task_definition=$(aws ecs register-task-definition \
              --cli-input-json "file://$rendered" \
              --query taskDefinition.taskDefinitionArn \
              --output text)

            echo "$task_definition"
          }

          run_backend_migrations() {
            local task_definition="$1"
            local network
            local subnets
            local security_groups
            local assign_public_ip
            local task_arn
            local exit_code

            network=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_BACKEND_SERVICE" \
              --query 'services[0].networkConfiguration.awsvpcConfiguration' \
              --output json)
            subnets=$(jq -r '.subnets | join(",")' <<< "$network")
            security_groups=$(jq -r '.securityGroups | join(",")' <<< "$network")
            assign_public_ip=$(jq -r '.assignPublicIp' <<< "$network")

            task_arn=$(aws ecs run-task \
              --cluster "$ECS_CLUSTER" \
              --launch-type FARGATE \
              --task-definition "$task_definition" \
              --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_groups],assignPublicIp=$assign_public_ip}" \
              --overrides "{\"containerOverrides\":[{\"name\":\"$ECS_BACKEND_CONTAINER\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}" \
              --query 'tasks[0].taskArn' \
              --output text)

            if [ -z "$task_arn" ] || [ "$task_arn" = "None" ]; then
              echo "Migration task did not start" >&2
              exit 1
            fi

            aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
            exit_code=$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" \
              --query "tasks[0].containers[?name=='$ECS_BACKEND_CONTAINER'].exitCode | [0]" \
              --output text)
            if [ "$exit_code" != "0" ]; then
              aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn"
              exit 1
            fi
          }

          update_service() {
            local service="$1"
            local task_definition="$2"
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$service" \
              --task-definition "$task_definition" \
              --deployment-configuration 'deploymentCircuitBreaker={enable=true,rollback=true}' \
              --force-new-deployment > /dev/null
          }

          smoke() {
            local path="$1"
            if [ -n "$PUBLIC_APP_URL" ]; then
              curl --fail --show-error --silent --retry 5 --retry-delay 5 "$PUBLIC_APP_URL$path" > /dev/null
            fi
          }

          backend_task_definition=$(register_task_definition \
            "$ECS_BACKEND_TASK_FAMILY" \
            "$ECS_BACKEND_CONTAINER" \
            "$BACKEND_IMAGE:$IMAGE_SHA")

          run_backend_migrations "$backend_task_definition"
          update_service "$ECS_BACKEND_SERVICE" "$backend_task_definition"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE"
          smoke "/readyz"

          frontend_task_definition=$(register_task_definition \
            "$ECS_FRONTEND_TASK_FAMILY" \
            "$ECS_FRONTEND_CONTAINER" \
            "$FRONTEND_IMAGE:$IMAGE_SHA")

          update_service "$ECS_FRONTEND_SERVICE" "$frontend_task_definition"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_FRONTEND_SERVICE"
          smoke "/"
