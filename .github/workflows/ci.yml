name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_ai
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U finance -d finance_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finance_ai
      DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finance_ai
      JWT_SECRET_KEY: ci-access-secret-not-for-production-1234567890
      JWT_REFRESH_SECRET_KEY: ci-refresh-secret-not-for-production-12345678
      OPENAI_API_KEY: ci-placeholder-openai-key
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Lint backend
        run: ruff check .
      - name: Smoke test migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Test backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Test frontend end to end
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start -- -p 3101
        run: npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore

  docker-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/remo-dif/finsight-ai-backend
      FRONTEND_IMAGE: ghcr.io/remo-dif/finsight-ai-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t finsight-ai-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t finsight-ai-frontend:ci ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finsight-ai-backend:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate backend Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: finsight-ai-backend:ci
          format: sarif
          output: trivy-backend.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload backend Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-backend-report
          path: trivy-backend.sarif
          if-no-files-found: ignore
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: finsight-ai-frontend:ci
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate frontend Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: finsight-ai-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload frontend Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-frontend-report
          path: trivy-frontend.sarif
          if-no-files-found: ignore
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag finsight-ai-backend:ci "$BACKEND_IMAGE:${GITHUB_SHA}"
          docker tag finsight-ai-backend:ci "$BACKEND_IMAGE:latest"
          docker push "$BACKEND_IMAGE:${GITHUB_SHA}"
          docker push "$BACKEND_IMAGE:latest"
      - name: Publish frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag finsight-ai-frontend:ci "$FRONTEND_IMAGE:${GITHUB_SHA}"
          docker tag finsight-ai-frontend:ci "$FRONTEND_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:${GITHUB_SHA}"
          docker push "$FRONTEND_IMAGE:latest"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
